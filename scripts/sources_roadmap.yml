# BBRT Source Roadmap — single source of truth for expansion.
#
# Drives both the Phase 2 big push and the Phase 4 weekly agent.
# status: built | buildable | blocked | no_data
#   built     = adapter merged and producing records
#   buildable = publicly fetchable now (CSV/Excel/API); ready for an adapter
#   blocked   = program/directory exists but not directly fetchable
#               (portal-only / login / CAPTCHA / records-request / offline) — reason required
#   no_data   = no public certified-firm directory found, or program is race-neutral
# confidence: confirmed_black | mbe_unverified  (only meaningful once built/buildable)
# ethnicity values are captured verbatim where observed; "" / [] where unverified.
#
# Generated 2026-06-10 from a 6-region parallel inventory sweep (50 states + DC +
# 5 territories + ~40 city/county programs + federal). See
# docs/data-sources/source-inventory.md for the narrative and
# docs/data-sources/ethnicity-field-audit.md for the QC value audit.

meta:
  generated: "2026-06-10"
  cross_cutting_risks:
    - "USDOT Interim Final Rule (49 CFR 23/26, effective 2025-10-03) is forcing
       nationwide DBE recertification; many DBE directories are offline or
       mid-reevaluation (CO offline, SD all-inactive, CA CUCP offline 2026-03-02).
       DBE-derived counts in mid-2026 are unstable — flag in methodology."
    - "B2Gnow / dbesystem.com / gob2g.com is the dominant platform. The same
       platform exposes an Ethnicity field with a 'Black American'/'Black' value
       on some agency instances (NV, CO, CA, OR, TN, MD-existing) but not others
       (UT, ID, NM, OK). Ethnicity is collected at registration on ALL instances,
       so the 'Download Entire Directory to Excel' export MAY contain an ethnicity
       column even where the search UI hides it — a one-off download check could
       flip several blocked sources to buildable/confirmed_black. The existing
       md_mbe adapter already parses a gob2g Excel export — reuse that pattern."

