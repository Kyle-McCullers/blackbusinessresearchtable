name: Quarterly Pipeline

on:
  schedule:
    # 6am UTC on the first of January, April, July, October
    - cron: '0 6 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: 'Override snapshot ID (e.g. 2026-Q2). Leave blank to use current quarter.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest research panel DB from Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The DB is distributed via GitHub Releases (not committed — it's a large
          # growing binary). Pull the latest so the pipeline can append this quarter's
          # snapshot and carry sources forward. First-ever run starts fresh.
          gh release download --pattern bbrt.duckdb --dir data --clobber || echo "No prior release DB; starting fresh."

      - name: Run pipeline
        working-directory: scripts
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
          SNAPSHOT_ID: ${{ github.event.inputs.snapshot_id }}
        run: |
          if [ -n "$SNAPSHOT_ID" ]; then
            python -m pipeline.run --snapshot-id "$SNAPSHOT_ID"
          else
            python -m pipeline.run
          fi

      - name: Publish research panel DB to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Distribute the (large, growing) DuckDB via Releases instead of git.
          # A new dated release each run keeps citable per-snapshot download points;
          # the site links to /releases/latest/download/bbrt.duckdb (auto-resolves to newest).
          TAG="data-$(date +%Y-%m-%d)"
          gh release create "$TAG" data/bbrt.duckdb \
            --title "BBRT research panel — $TAG" \
            --notes "Automated quarterly snapshot." --latest \
          || gh release upload "$TAG" data/bbrt.duckdb --clobber

      - name: Commit and push updated CSV + summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/businesses.csv data/snapshots/
          git diff --staged --quiet || git commit -m "chore: quarterly pipeline update"
          git push
